[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "ai-council"
version = "0.1.0"
description = "Telegram-based AI advisory council"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29",
    "alembic>=1.14",
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "openai>=1.30",
    "anthropic>=0.28",
    "google-generativeai>=0.7",
    "python-dotenv>=1.0",
    "pytz>=2024.1",
    "tenacity>=8.3",
]

[project.scripts]
ai-council-webhook = "council.webhook.__main__:main"
ai-council-worker = "council.worker.__main__:main"
ai-council-migrate = "council.db.migrate:main"
ai-council-register-webhook = "council.webhook.register:main"

[tool.setuptools.packages.find]
include = ["council*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "anyio>=4.4",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
